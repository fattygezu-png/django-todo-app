<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django To-Do App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4">
                        
                        <!-- Header with User Greeting & Logout -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h2 class="card-title text-primary m-0 fw-bold">
                                <i class="fa-solid fa-list-check me-2"></i>My To-Do List
                            </h2>
                            <div class="d-flex align-items-center gap-2">
                                <span class="text-muted fw-semibold">Hi, {{ user.username }}!</span>
                                <form method="POST" action="{% url 'logout' %}">
                                    {% csrf_token %}
                                    <button type="submit" class="btn btn-outline-secondary btn-sm">Logout</button>
                                </form>
                            </div>
                        </div>

                        <!-- Task Creation Form -->
                        <form method="POST" class="mb-4">
                            {% csrf_token %}
                            <div class="input-group">
                                <input type="text" name="title" class="form-control form-control-lg" placeholder="Add a new task..." required>
                                <button type="submit" class="btn btn-primary px-4">
                                    <i class="fa-solid fa-plus me-1"></i> Add
                                </button>
                            </div>
                        </form>

                        <!-- Task List -->
                        <ul class="list-group">
                            {% for task in tasks %}
                                <li class="list-group-item d-flex justify-content-between align-items-center py-3 {% if task.completed %}bg-light{% endif %}">
                                    <span class="fs-5 {% if task.completed %}text-decoration-line-through text-muted{% endif %}">
                                        {{ task.title }}
                                    </span>

                                    <div>
                                        <!-- Complete/Undo Button -->
                                        <a href="{% url 'toggle_task' task.id %}" class="btn btn-sm {% if task.completed %}btn-warning{% else %}btn-success{% endif %} me-1">
                                            {% if task.completed %}
                                                <i class="fa-solid fa-rotate-left"></i>
                                            {% else %}
                                                <i class="fa-solid fa-check"></i>
                                            {% endif %}
                                        </a>

                                        <!-- Delete Button -->
                                        <a href="{% url 'delete_task' task.id %}" class="btn btn-sm btn-danger">
                                            <i class="fa-solid fa-trash"></i>
                                        </a>
                                    </div>
                                </li>
                            {% empty %}
                                <li class="list-group-item text-center text-muted py-4">
                                    No tasks added yet! Add one above to get started.
                                </li>
                            {% endfor %}
                        </ul>

                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
